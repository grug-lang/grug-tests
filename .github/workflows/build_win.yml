name: CI Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build windows ${{ matrix.compiler }} 
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      matrix:
        compiler: [msvc, gcc, clang]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Clang 23 (if needed)
        if: matrix.compiler == 'clang'
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/LLVM-23.1.0-win64.msi" -OutFile "LLVM-installer.msi"
          Start-Process msiexec.exe -ArgumentList "/i LLVM-installer.msi /quiet /norestart" -Wait
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and run tests (Debug + Release)
        run: |
          foreach ($BUILD_TYPE in @("Debug", "Release")) {
            Write-Host "=== Building $BUILD_TYPE ==="

            $BUILD_DIR = "build-$($BUILD_TYPE.ToLower())"

            if ("${{ matrix.compiler }}" -eq "msvc") {
              $CMAKE_FLAGS = @("-G", "Visual Studio 18 2026")
            } else {
              $CMAKE_FLAGS = @("-G", "Ninja", "-DCMAKE_BUILD_TYPE=$BUILD_TYPE" , "-DCMAKE_C_COMPILER=${{ matrix.compiler }}")
            }

            cmake -S . -B $BUILD_DIR @CMAKE_FLAGS
            cmake --build $BUILD_DIR --config=$BUILD_TYPE

            Write-Host "=== Running tests ($BUILD_TYPE) ==="

            $TEST_EXE = Get-ChildItem -Path $BUILD_DIR -Recurse -File |
              Where-Object { $_.Name -eq "smoketest" -or $_.Name -eq "smoketest.exe" } |
              Select-Object -First 1

            $TEST_EXE.FullName
          }

        env:
          SHUFFLES: 10
